packages:
  - apps/*
  - packages/*
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  esbuild: true
  "@swc/core": true
  "@parcel/watcher": true
  unrs-resolver: true

overrides:
  # Keep Drizzle's pg peer identical in the root tools and backend workspace.
  pg: 8.23.1
  "vite@>=7.0.0 <7.3.7": 7.3.7
  braces: 3.0.3
  sharp: 0.35.5
  source-map-js: 1.2.2
  shell-quote: 1.11.0
  postcss: 8.5.23
  "brace-expansion@<2": 1.1.21
  "brace-expansion@>=2 <3": 2.1.7
  "uuid@<11": 11.1.1
  "esbuild@<0.24.3": 0.25.12
  "brace-expansion@>=5 <6": 5.0.12

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
