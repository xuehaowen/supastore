services:
  postgres:
    image: postgres:18-alpine
    container_name: supastore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supastore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "9001:8080"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: supastore-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: supastore:latest
    container_name: supastore-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supastore}?sslmode=disable
      - ADMIN_SETUP_SECRET=${ADMIN_SETUP_SECRET:-change-me-to-a-secure-random-secret-for-bootstrap}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-to-a-secure-random-auth-secret-min-32-chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET_PRIVATE=supastore-private
      - S3_BUCKET_PUBLIC=supastore-public
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-rustfsadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      - ENABLE_OUTBOX_WORKER=true
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=milkybakery.contact@gmail.com
      - SMTP_PASSWORD="nypj zryl ylsi lhxu"
      - SMTP_FROM="Milky Bakery <milkybakery.contact@gmail.com>"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  rustfs_data:
