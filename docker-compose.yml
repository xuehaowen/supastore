services:
  postgres:
    image: postgres:18-alpine
    container_name: supastore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supastore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:9002:8080"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: supastore-rustfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - rustfs_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: supastore-backend:latest
    restart: unless-stopped
    stop_grace_period: 45s
    expose: ["3000"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supastore}?sslmode=disable
      - ADMIN_SETUP_SECRET=${ADMIN_SETUP_SECRET:?Set ADMIN_SETUP_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${STOREFRONT_ORIGIN:-http://localhost:3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - STOREFRONT_ORIGIN=${STOREFRONT_ORIGIN:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET_PRIVATE=supastore-private
      - S3_BUCKET_PUBLIC=supastore-public
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      - ENABLE_OUTBOX_WORKER=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-nodemailer}
      - SMTP_OAUTH_CLIENT_ID=${SMTP_OAUTH_CLIENT_ID:-}
      - SMTP_OAUTH_CLIENT_SECRET=${SMTP_OAUTH_CLIENT_SECRET:-}
      - SMTP_OAUTH_REFRESH_TOKEN=${SMTP_OAUTH_REFRESH_TOKEN:-}
      - SMTP_SECURE
      - SMTP_REQUIRE_TLS
      - SMS_PROVIDER=${SMS_PROVIDER:-disabled}
      - PHONE_VERIFICATION_PROVIDER=${PHONE_VERIFICATION_PROVIDER:-disabled}
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - TELNYX_FROM=${TELNYX_FROM:-}
      - TELNYX_MESSAGING_PROFILE_ID=${TELNYX_MESSAGING_PROFILE_ID:-}
      - TELNYX_VERIFY_PROFILE_ID=${TELNYX_VERIFY_PROFILE_ID:-}
      - TELNYX_VERIFY_PROFILE_ID_ZH=${TELNYX_VERIFY_PROFILE_ID_ZH:-}
      - TELNYX_PUBLIC_KEY=${TELNYX_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: storefront
      args:
        BACKEND_URL: http://backend:3000
    image: supastore-storefront:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
      STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:-http://localhost:3000}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    profiles: [migration]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supastore}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
