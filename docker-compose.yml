services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: supastore:latest
    container_name: supastore-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://supastore:${POSTGRES_PASSWORD:-postgres_secure_password}@db:5432/supastore?sslmode=disable
      - ADMIN_SETUP_SECRET=${ADMIN_SETUP_SECRET:-replace_with_a_secure_admin_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace_with_a_secure_better_auth_secret_at_least_32_chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-supastore-evidence}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
      - ENABLE_OUTBOX_WORKER=true
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: postgres:16-alpine
    container_name: supastore-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=supastore
      - POSTGRES_USER=supastore
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supastore -d supastore"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
