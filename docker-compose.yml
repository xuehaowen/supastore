services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: ${COMPOSE_PROJECT_NAME:-supastore}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supastore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: ${COMPOSE_PROJECT_NAME:-supastore}-rustfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - rustfs_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ${BACKEND_IMAGE:-supastore-backend:latest}
    restart: unless-stopped
    stop_grace_period: 45s
    expose: ["3000"]
    environment: &backend-environment
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${APP_DATABASE_USER:-supastore_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-supastore}?sslmode=disable
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-30000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-5000}
      - DB_IDLE_TRANSACTION_TIMEOUT_MS=${DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      - REPORT_MAX_SOURCE_ROWS=${REPORT_MAX_SOURCE_ROWS:-100000}
      - REPORT_MAX_EXPORT_BYTES=${REPORT_MAX_EXPORT_BYTES:-67108864}
      - REPORT_TIMEOUT_MS=${REPORT_TIMEOUT_MS:-30000}
      - NODE_OPTIONS=${BACKEND_NODE_OPTIONS:---max-old-space-size=256}
      - ADMIN_SETUP_SECRET=${ADMIN_SETUP_SECRET:?Set ADMIN_SETUP_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${STOREFRONT_ORIGIN:?Set STOREFRONT_ORIGIN to the public storefront origin}
      - APP_URL=${STOREFRONT_ORIGIN:?Set STOREFRONT_ORIGIN to the public storefront origin}
      - STOREFRONT_ORIGIN=${STOREFRONT_ORIGIN:?Set STOREFRONT_ORIGIN to the public storefront origin}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_API_PORT:-9000}}
      - S3_BUCKET_PRIVATE=supastore-private
      - S3_BUCKET_PUBLIC=supastore-public
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      - ENABLE_OUTBOX_WORKER=${ENABLE_OUTBOX_WORKER:-true}
      - PICKUP_REMINDER_LEAD_MINUTES=${PICKUP_REMINDER_LEAD_MINUTES:-180}
      - DISABLE_OUTBOUND_DELIVERY=${DISABLE_OUTBOUND_DELIVERY:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-nodemailer}
      - SMTP_OAUTH_CLIENT_ID=${SMTP_OAUTH_CLIENT_ID:-}
      - SMTP_OAUTH_CLIENT_SECRET=${SMTP_OAUTH_CLIENT_SECRET:-}
      - SMTP_OAUTH_REFRESH_TOKEN=${SMTP_OAUTH_REFRESH_TOKEN:-}
      - SMTP_SECURE
      - SMTP_REQUIRE_TLS
      # disabled: silent; console: local previews; telnyx: authorized live delivery.
      # Global DISABLE_OUTBOUND_DELIVERY also stops console previews.
      - SMS_PROVIDER=${SMS_PROVIDER:-disabled}
      - SMS_LIVE_AUTHORIZED=${SMS_LIVE_AUTHORIZED:-false}
      # Console mode does not provide phone verification or enable enrollment.
      - PHONE_VERIFICATION_PROVIDER=${PHONE_VERIFICATION_PROVIDER:-disabled}
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - TELNYX_FROM=${TELNYX_FROM:-}
      - TELNYX_MESSAGING_PROFILE_ID=${TELNYX_MESSAGING_PROFILE_ID:-}
      - TELNYX_VERIFY_PROFILE_ID=${TELNYX_VERIFY_PROFILE_ID:-}
      - TELNYX_VERIFY_PROFILE_ID_ZH=${TELNYX_VERIFY_PROFILE_ID_ZH:-}
      - TELNYX_PUBLIC_KEY=${TELNYX_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ${WORKER_IMAGE:-supastore-worker:latest}
    restart: unless-stopped
    stop_grace_period: 45s
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: storefront
      args:
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
    image: ${STOREFRONT_IMAGE:-supastore-storefront:latest}
    restart: unless-stopped
    ports:
      # Use loopback with a host TLS proxy; explicitly opt into other interfaces.
      - "${STOREFRONT_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${STOREFRONT_NODE_OPTIONS:---max-old-space-size=256}
      BACKEND_URL: http://backend:3000
      STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:?Set STOREFRONT_ORIGIN to the public storefront origin}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    image: ${MIGRATION_IMAGE:-${COMPOSE_PROJECT_NAME:-supastore}-migrate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    profiles: [migration]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supastore}?sslmode=disable
      APP_DATABASE_USER: ${APP_DATABASE_USER:-supastore_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
