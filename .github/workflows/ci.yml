name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:coverage
      - run: pnpm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d supastore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supastore_test
      - run: pnpm run test:integration

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d supastore"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supastore
      - run: pnpm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supastore
      - run: pnpm start > .playwright-server.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supastore
          PORT: 3000
      - run: pnpm exec playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supastore
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
            .playwright-server.log
