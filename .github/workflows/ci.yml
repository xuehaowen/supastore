name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm --filter @supastore/storefront run typecheck
      - run: pnpm test
      - run: pnpm run test:storefront:unit
      - run: pnpm run test:coverage
      - run: pnpm run test:frontend:coverage
      - run: pnpm run build:backend
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build_only
          BETTER_AUTH_SECRET: build-only-placeholder-secret-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - run: pnpm --filter @supastore/storefront run build
        env:
          BACKEND_URL: http://127.0.0.1:3000

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration

  postgres-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: supastore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supastore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration --no-file-parallelism
        env:
          DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/supastore_test
          TRANSLATION_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/supastore_test
          DISABLE_OUTBOUND_DELIVERY: "false"
          EMAIL_PROVIDER: nodemailer
          SMS_PROVIDER: disabled
          PHONE_VERIFICATION_PROVIDER: disabled
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1"
          SMTP_SECURE: "false"
          SMTP_REQUIRE_TLS: "false"
          SMTP_USER: ""
          SMTP_PASSWORD: ""

  container-acceptance:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: fixture-only
      APP_DATABASE_PASSWORD: fixture-runtime-only
      ADMIN_SETUP_SECRET: SyntheticSetupSecret123!
      BETTER_AUTH_SECRET: SyntheticAuthSecretForContainerTests123!
      S3_ACCESS_KEY_ID: fixture
      S3_SECRET_ACCESS_KEY: fixture-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:containers

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - run: node scripts/test-storefront.mjs --measure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
